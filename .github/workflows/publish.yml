name: Publish PowerBalance release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import source bundle
        env:
          SOURCE_URL: https://aka.doubaocdn.com/s/tlnDZbUToW
        run: |
          set -e
          # 只在仓库尚未导入 v2.7.4 时执行，避免以后 push 覆盖新代码。
          if [ -f module.prop ]; then
            code=$(sed -n 's/^versionCode=//p' module.prop | head -n 1)
            case "$code" in
              ''|*[!0-9]*) ;;
              *) [ "$code" -ge 16 ] && { echo "Source v2.7.4+ already imported; skip"; exit 0; } ;;
            esac
          fi
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/power-balance-src.tar.gz "$SOURCE_URL"
          tar -xzf /tmp/power-balance-src.tar.gz -C .
          rm -f /tmp/power-balance-src.tar.gz

      - name: Commit imported source
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update PowerBalance v2.7.4 source"
            git push origin HEAD:main
          fi

      - name: Download release assets
        env:
          MODULE_URL: https://aka.doubaocdn.com/s/UEYwzN5O1q
          SOURCE_URL: https://aka.doubaocdn.com/s/tlnDZbUToW
        run: |
          set -e
          curl -L --fail --retry 3 --retry-delay 2 -o power-balance-magisk-v2.7.4.zip "$MODULE_URL"
          curl -L --fail --retry 3 --retry-delay 2 -o power-balance-src-v2.7.4.tar.gz "$SOURCE_URL"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.4
          name: PowerBalance v2.7.4
          body_path: CHANGELOG.md
          files: |
            power-balance-magisk-v2.7.4.zip
            power-balance-src-v2.7.4.tar.gz
          draft: false
          prerelease: false
