name: Backfill PowerBalance v2.7.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v2.7.3 tag
        env:
          SOURCE_URL: https://aka.doubaocdn.com/s/zwsX9PVXo7
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b backfill-v2.7.3
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/pb273.tar.gz "$SOURCE_URL"
          tar -xzf /tmp/pb273.tar.gz -C .
          rm -f /tmp/pb273.tar.gz
          git add -A
          git commit -m "Backfill PowerBalance v2.7.3 source"
          git tag v2.7.3
          git push origin v2.7.3

      - name: Download release assets
        env:
          MODULE_URL: https://aka.doubaocdn.com/s/O8YshJVIbW
          SOURCE_URL: https://aka.doubaocdn.com/s/zwsX9PVXo7
        run: |
          set -e
          curl -L --fail --retry 3 --retry-delay 2 -o power-balance-magisk-v2.7.3.zip "$MODULE_URL"
          curl -L --fail --retry 3 --retry-delay 2 -o power-balance-src-v2.7.3.tar.gz "$SOURCE_URL"

      - name: Create v2.7.3 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.3
          name: PowerBalance v2.7.3
          body_path: CHANGELOG.md
          files: |
            power-balance-magisk-v2.7.3.zip
            power-balance-src-v2.7.3.tar.gz
          make_latest: false
          draft: false
          prerelease: false
